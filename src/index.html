<!doctype html>
<html lang="es">
<head>
  <!-- El equipo ya usa Multaka: esta app lleva a la misma página allí (los responsables entran con su acceso de siempre). -->
  <script>
    (function () {
      var EQUIPO = 'kcLtpfQsdHG1Z84rtzi6';
      var r = location.hash.replace(/^#\/?/, '').split(/[?/]/)[0];
      if (['multas', 'nueva', 'reglamento'].indexOf(r) < 0) r = '';
      var t = '';
      try {
        var a = JSON.parse(localStorage.getItem('cdv.admin') || 'null');
        if (a && typeof a.token === 'string') t = a.token;
      } catch (e) {}
      location.replace(
        t
          ? 'https://multaka.app/cdv?e=' + EQUIPO + '#t=' + encodeURIComponent(t) + '&r=' + r
          : 'https://multaka.app/e/' + EQUIPO + (r ? '/' + r : '')
      );
    })();
  </script>
  <meta charset="utf-8">
  <title>Multas CDV</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd400">
  <meta name="description" content="Control de multas del régimen interno del CD Villamanta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Multas CDV">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
</head>
<body>
  <app-root></app-root>
</body>
</html>
